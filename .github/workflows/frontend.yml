name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run tests with coverage
        id: coverage
        run: npm run test:coverage
      - name: Summarize frontend coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' && hashFiles('frontend/coverage/summary.txt') != '' }}
        run: |
          {
            echo '## Frontend test coverage'
            echo '~~~text'
            cat coverage/summary.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
      - run: npm run build
